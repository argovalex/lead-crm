<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>לידים GMDSS</title>
<link rel="stylesheet" href="/styles.css">
<style>
/* The table takes whatever height is left under the toolbars, so the page has one scrollbar, not two. */
main{display:flex;flex-direction:column;min-height:calc(100vh - 56px)}
body.embed .top{display:none}
body.embed main{padding:8px 10px 12px;min-height:100vh;height:100vh}
.gtable-wrap{flex:1;min-height:260px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.ghead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.ghead h2{margin:0;font-size:18px}
.bulkbar{position:static}
.kpis2{margin-bottom:10px}
.kpis2 button.k{font:inherit;color:inherit;text-align:start;padding:6px 14px;min-width:104px}
.kpis2 .k b{font-size:20px}
.kpis2 .k span{font-size:12px;color:var(--muted)}
@media(max-width:700px){.kpis2{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.kpis2 button.k{flex:none;min-width:88px}}
.kpis2 .k.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
table.g{border-collapse:collapse;width:100%;font-size:13px}
table.g th,table.g td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
table.g th{position:sticky;top:0;background:#eef0eb;cursor:pointer;white-space:nowrap;user-select:none;z-index:1}
table.g tbody tr:hover{background:#f6f8f5}
table.g tr.p-A td:first-child{box-shadow:inset 5px 0 0 #b23a3a}
table.g tr.p-B td:first-child{box-shadow:inset 5px 0 0 #c28a1d}
table.g tr.p-C td:first-child{box-shadow:inset 5px 0 0 #aab3ad}
table.g tr.p-A{background:#fdf3f3}table.g tr.p-B{background:#fdf8ec}
.org{display:flex;align-items:center;gap:6px;font-weight:600}
.org .ed{padding:0 6px;line-height:20px;flex:none}
.why{color:#6b756e;font-size:12px;margin-top:2px;max-width:260px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ct{display:flex;flex-direction:column;gap:1px;direction:ltr;text-align:left;font-size:12px}
.stlink{text-decoration:none;color:inherit;cursor:pointer;display:inline-flex;flex-wrap:wrap;gap:3px}.stlink:hover .st{filter:brightness(.93)}
.st{font-size:12px;border-radius:6px;padding:1px 7px;background:#e8eae5;white-space:nowrap}
.st.sent{background:#d6efe1;color:#1f6f54}.st.failed,.st.bounced{background:#f5d9d9;color:var(--danger)}.st.queued{background:#f6e8cf;color:var(--warn)}
.egs{display:inline-flex;gap:3px;white-space:nowrap}
.eg{display:inline-block;border-radius:10px;padding:1px 7px;background:#eceee9;color:#a3aaa5;font-size:11px}
.eg.on{background:#1f6f54;color:#fff}
.muted-cell{color:#b3b9b4}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.vars button{font-size:12px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:20}
.dlg .box{background:#fff;border-radius:12px;padding:20px;max-width:780px;width:94%;max-height:92vh;overflow:auto}
.dlg label{display:block;margin-top:8px}
.prev{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fafaf8;margin-top:6px}
.warn{color:var(--warn)}
</style>
</head>
<body>
<header class="top">
  <div class="brand">◆ CRM</div>
  <nav><a class="btn ghost" href="/">← חזרה ל-CRM</a></nav>
</header>
<main>
  <div class="ghead">
    <h2>לידים GMDSS <span class="muted" id="count"></span></h2>
    <span class="spacer" style="flex:1"></span>
    <button class="btn" id="rem">🔔 תזכורות</button>
    <button class="btn" id="tpls">✎ תבניות מייל</button>
    <button class="btn" id="imp">ייבוא CSV</button><input type="file" id="imp-file" accept=".csv,text/csv" class="hidden">
    <button class="btn" id="refresh" title="רענון סטטוס פתיחות והקלקות" aria-label="רענון">⟳</button>
  </div>
  <div id="cfgwarn" class="warn hidden" style="margin-bottom:8px"></div>
  <div class="kpis2" id="kpis"></div>
  <div class="toolbar">
    <input id="q" type="search" placeholder="חיפוש בכל השדות" style="min-width:200px">
    <select id="f-eng" aria-label="סטטוס מייל">
      <option value="">כל סטטוסי המייל</option><option value="sent">נשלח</option><option value="opened">נפתח</option>
      <option value="clicked">הקליק על קישור</option><option value="unopened">נשלח ולא נפתח</option><option value="failed">נכשל / חזר</option>
      <option value="replied">השיב</option><option value="answered">נענו (שלחנו תשובה)</option><option value="reminded">קיבלו תזכורת</option><option value="manualRem">תזכורת ידנית</option><option value="followup">מעקב להיום</option><option value="closed">סגורים</option><option value="open">פתוחים (לא סגורים)</option>
    </select>
    <button class="btn" id="f-toggle" type="button" aria-expanded="false" aria-controls="f-more">סינון <span id="f-count" class="badge hidden"></span></button>
    <button class="btn ghost hidden" id="reset" type="button">נקה סינון</button>
  </div>
  <div class="toolbar f-more hidden" id="f-more">
    <select id="f-country" aria-label="מדינה"><option value="">כל המדינות</option></select>
    <select id="f-segment" aria-label="סוג"><option value="">כל הסוגים</option></select>
    <select id="f-fit" aria-label="התאמת מוצר"><option value="">כל ההתאמות</option><option value="Course">קורס</option><option value="Simulator">סימולטור</option><option value="Both">שניהם</option></select>
    <select id="f-priority" aria-label="עדיפות"><option value="">כל העדיפויות</option><option>A</option><option>B</option><option>C</option></select>
    <select id="f-template" aria-label="תבנית"><option value="">כל התבניות</option></select>
  </div>
  <div class="toolbar bulkbar hidden" id="bulk-bar">
    <b id="sel-n"></b>
    <button class="btn primary" id="send">✉ שליחת מייל</button>
    <button class="btn" id="attach">שיוך תבנית</button>
    <button class="btn" id="bulk-close">⛔ סגירה ועצירה</button>
    <button class="btn" id="bulk-del" style="color:#b91c1c">🗑 מחיקה</button>
    <span class="spacer"></span>
    <button class="btn ghost" id="sel-none">נקה בחירה</button>
  </div>
  <div class="gtable-wrap"><table class="g" id="tbl"><thead></thead><tbody></tbody></table></div>
</main>
<div id="toast" class="toast"></div>
<div id="dlg" class="dlg hidden"><div class="box" id="dlg-box"></div></div>
<script src="/gmdss.js"></script>
</body>
</html>
