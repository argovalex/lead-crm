<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>כניסה · CRM</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 1l7 7-7 7-7-7z%22 fill=%22%231f6f54%22/%3E%3C/svg%3E">
</head>
<body class="login-body">
<form class="login-card" id="f">
  <div class="brand">◆ CRM</div>
  <label>אימייל<input name="email" type="email" autocomplete="username" required></label>
  <label>סיסמה<input name="password" type="password" autocomplete="current-password" required></label>
  <button class="btn primary" type="submit">כניסה</button>
  <p class="err" id="err"></p>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target));
  const r = await fetch('/auth/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(fd) });
  if (r.ok) location.href = '/';
  else document.getElementById('err').textContent = r.status === 429 ? 'יותר מדי ניסיונות, נסה שוב מאוחר יותר' : 'פרטי התחברות שגויים';
});
</script>
</body>
</html>
